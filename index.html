<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>随手记</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9; color: #1a1a1a; -webkit-font-smoothing: antialiased;
    }
    #app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }
    header {
      padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px));
      font-size: 17px; font-weight: 600; background: #fff; border-bottom: 1px solid #ececec;
    }
    #list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); word-break: break-word; }
    .msg .t { font-size: 15px; line-height: 1.4; }
    .msg .m { font-size: 12px; color: #8a8f98; margin-top: 4px; }
    .empty { text-align: center; color: #8a8f98; font-size: 14px; margin-top: 40px; }
    #input-bar {
      display: flex; gap: 8px; padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: #fff; border-top: 1px solid #ececec;
    }
    #txt { flex: 1; font-size: 16px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; background: #fff; }
    #txt:focus { border-color: #3b82f6; }
    #send { border: none; background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 10px; }
    #send:disabled { opacity: .5; }
    #imgbtn { border: none; background: #eef1f5; color: #3b82f6; font-size: 20px; width: 42px; border-radius: 10px; flex-shrink: 0; }
    #preview { position: relative; margin: 8px 16px 0; }
    #preview img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; display: block; }
    #preview-x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border: none; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; line-height: 1; }
    .msgimg { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 6px; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 50; display: flex; align-items: center; justify-content: center; }
    #lightbox img { max-width: 100%; max-height: 100%; }
    #preview[hidden], #lightbox[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <header>随手记</header>
    <div id="list"><div class="empty">还没有记录，输入一条开始吧</div></div>
    <div id="preview" hidden>
      <img id="preview-img" alt="">
      <button id="preview-x" title="移除图片">×</button>
    </div>
    <div id="input-bar">
      <button id="imgbtn" title="添加图片">🖼️</button>
      <input id="txt" placeholder="记点什么…" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <input type="file" id="imgfile" accept="image/*" hidden>
    <div id="lightbox" hidden><img id="lightbox-img" alt=""></div>
  </div>
  <!-- 真实配置放在 config.local.js（不进仓库）。部署前先填好，否则页面会提示未配置。 -->
  <script src="config.local.js"></script>
  <script>
    var CFG = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG : {};
    var API_URL = CFG.API_URL || '';
    var KEY = CFG.KEY || '';

    var list = document.getElementById('list');
    var txt = document.getElementById('txt');
    var send = document.getElementById('send');
    var imgbtn = document.getElementById('imgbtn');
    var imgfile = document.getElementById('imgfile');
    var preview = document.getElementById('preview');

    function fmt(t) {
      var d = new Date(t);
      function p(n){ return (n < 10 ? '0' : '') + n; }
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    var MAX_IMG_DIM = 1280;
    var IMG_QUALITY = 0.72;
    var pendingImage = null;

    function isSafeImage(s) {
      return typeof s === 'string' && s.indexOf('data:image/') === 0;
    }
    function compressImage(file) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function() {
          var scale = Math.min(1, MAX_IMG_DIM / Math.max(img.width, img.height));
          var cw = Math.max(1, Math.round(img.width * scale));
          var ch = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
        };
        img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
        img.src = url;
      });
    }
    function clearImage() {
      pendingImage = null;
      imgfile.value = '';
      preview.hidden = true;
    }
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').hidden = false;
    }
    async function load() {
      if (!API_URL || !KEY) {
        list.innerHTML = '<div class="empty">未配置：请把 config.example.js 复制为 config.local.js，填入你的环境地址与 key</div>';
        return;
      }
      try {
        var res = await fetch(API_URL + '/v1/rdb/rest/entries?select=*&order=created_at.desc&limit=30', {
          headers: { 'Authorization': 'Bearer ' + KEY }
        });
        var rows = await res.json();
        list.innerHTML = '';
        if (!Array.isArray(rows) || rows.length === 0) {
          list.innerHTML = '<div class="empty">还没有记录，输入一条开始吧</div>';
          return;
        }
        rows.forEach(function(r){
          var div = document.createElement('div');
          div.className = 'msg';
          if (isSafeImage(r.image)) {
            var im = document.createElement('img');
            im.className = 'msgimg';
            im.src = r.image;
            im.addEventListener('click', function(){ openLightbox(r.image); });
            div.appendChild(im);
          }
          if (r.text) {
            var t = document.createElement('div');
            t.className = 't';
            t.textContent = r.text;
            div.appendChild(t);
          }
          var m = document.createElement('div');
          m.className = 'm';
          m.textContent = fmt(r.created_at);
          div.appendChild(m);
          list.appendChild(div);
        });
      } catch(e) {
        list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
      }
    }
    async function add() {
      var text = txt.value.trim();
      if (!text && !pendingImage) return;
      send.disabled = true;
      try {
        var body = { text: text };
        if (pendingImage) body.image = pendingImage;
        var res = await fetch(API_URL + '/v1/rdb/rest/entries', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) { var err = await res.text(); throw new Error('HTTP ' + res.status + ' ' + err); }
        txt.value = '';
        clearImage();
        load();
      } catch(e) {
        alert('发送失败：' + e.message);
      } finally {
        send.disabled = false;
      }
    }
    send.addEventListener('click', add);
    txt.addEventListener('keydown', function(e){ if (e.key === 'Enter') add(); });
    imgbtn.addEventListener('click', function(){ imgfile.click(); });
    imgfile.addEventListener('change', function() {
      var f = imgfile.files && imgfile.files[0];
      if (!f) return;
      compressImage(f).then(function(dataUrl) {
        pendingImage = dataUrl;
        document.getElementById('preview-img').src = dataUrl;
        preview.hidden = false;
      }).catch(function(e) {
        alert('图片处理失败：' + e.message);
        imgfile.value = '';
      });
    });
    document.getElementById('preview-x').addEventListener('click', clearImage);
    document.getElementById('lightbox').addEventListener('click', function() { this.hidden = true; });
    load();
  </script>
</body>
</html>
